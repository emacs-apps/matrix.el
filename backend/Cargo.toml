[package]
name = "matrix-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs"] }
matrix-sdk-ui = { version = "=0.19.1", default-features = false }
eyeball-im = "0.9.1"
futures-util = "0.3.34"
fs2 = "0.4.3"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"

tempfile = "3"

[dev-dependencies]
wiremock = "0.6.5"

[patch.crates-io]
# Build the locked version from imported source; its build script is relocatable.
libsqlite3-sys = { path = "../../../third_party/rusqlite/libsqlite3-sys" }
